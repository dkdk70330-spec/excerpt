<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#faf9f7">
<title>발췌기</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&amp;family=Gaegu:wght@300;400;700&amp;family=Gamja+Flower&amp;family=Gowun+Batang:wght@400;700&amp;family=Gowun+Dodum&amp;family=Hahmlet:wght@400;500;600;700&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;family=Noto+Serif+KR:wght@400;500;600;700&amp;family=Song+Myung&amp;family=Yeon+Sung&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f7;
  --paper:#fff;
  --ink:#181818;
  --muted:#8e8e93;
  --line:#e8e6e2;
  --sheet:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif}
body{min-height:100dvh}
button,input,select{font:inherit}
button{cursor:pointer}
.app{width:min(820px,100%);margin:0 auto;min-height:100dvh;padding:max(14px,env(safe-area-inset-top)) 14px max(100px,env(safe-area-inset-bottom))}
.modebar{
  position:sticky;top:0;z-index:20;
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:4px;padding:8px;
  background:rgba(250,249,247,.93);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)
}
.mode{border:0;background:transparent;color:#777;padding:10px 6px;border-radius:12px;font-weight:750;font-size:14px}
.mode.active{background:#111;color:#fff}
.novel-tools{
  display:none;justify-content:flex-end;padding:4px 8px 0;
}
.novel-tools.show{display:flex}
.subtle-btn{
  border:1px solid var(--line);background:#fff;color:#333;border-radius:11px;
  min-height:36px;padding:0 12px;font-size:12px;font-weight:750;
}
.canvas-shell{display:flex;justify-content:center;padding:14px 0 130px}
.canvas{
  width:min(100%,720px);background:var(--paper);
  box-shadow:0 8px 32px rgba(0,0,0,.05);
  overflow:hidden
}
.canvas.novel{min-height:980px;padding:9% 8%}
.canvas.chat{min-height:900px;padding:8% 6%;background:#f4f4f2}

.block{
  position:relative;outline:none;white-space:pre-wrap;word-break:break-word;
  border-radius:7px;transition:.12s ease
}
.block + .block{margin-top:18px}
.block.selected{
  background:rgba(0,0,0,.035);
  box-shadow:0 0 0 1px rgba(0,0,0,.08) inset
}
.novel .block{font-size:20px;line-height:1.82;letter-spacing:-.02em}
.novel .block + .block{margin-top:26px}
.block.center{text-align:center}
.block.right{text-align:right}
.effect-emphasis{font-weight:800!important;font-size:1.10em}
.effect-quote{padding-left:18px;border-left:3px solid currentColor}
.highlight-text{
  background:#f3dfc5;
  padding:0 3px 2px;
  border-radius:4px;
  box-decoration-break:clone;
  -webkit-box-decoration-break:clone
}
.role-tag{
  display:inline-flex;
  align-items:center;
  min-height:20px;
  margin:0 0 6px;
  padding:2px 7px;
  border-radius:999px;
  background:#f1f0ed;
  color:#777;
  font-size:10px;
  font-weight:750;
  user-select:none
}
.credit{margin-top:38px;text-align:right;color:#a0a0a5;font-size:14px}


.actions{
  position:fixed;z-index:30;left:50%;bottom:max(12px,env(safe-area-inset-bottom));
  transform:translateX(-50%);width:min(792px,calc(100% - 24px));
  display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;
  background:rgba(250,249,247,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-radius:18px
}
.action{height:50px;border:1px solid var(--line);border-radius:14px;background:#fff;font-weight:800}
.action.primary{background:#111;color:#fff;border-color:#111}
.fab{
  position:fixed;right:18px;bottom:max(82px,calc(env(safe-area-inset-bottom) + 78px));
  z-index:28;width:46px;height:46px;border:0;border-radius:50%;
  background:#111;color:#fff;font-size:24px;box-shadow:0 8px 22px rgba(0,0,0,.15)
}

.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:40;display:none}
.sheet-backdrop.show{display:block}
.sheet{
  position:fixed;z-index:41;left:50%;bottom:0;transform:translateX(-50%) translateY(105%);
  width:min(820px,100%);max-height:84dvh;overflow:auto;background:var(--sheet);
  border-radius:22px 22px 0 0;padding:16px 16px max(22px,env(safe-area-inset-bottom));
  box-shadow:0 -16px 50px rgba(0,0,0,.16);transition:.22s ease
}
.sheet.show{transform:translateX(-50%) translateY(0)}
.handle{width:38px;height:4px;border-radius:99px;background:#d7d7da;margin:0 auto 14px}
.sheet-title{font-size:14px;font-weight:800;margin-bottom:12px}
.label{font-size:12px;color:#888;margin:12px 0 7px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{
  border:1px solid var(--line);background:#fff;border-radius:12px;
  padding:9px 12px;font-size:13px;font-weight:700;color:#222
}
.chip.on{background:#111;color:#fff;border-color:#111}
.chip.soft-on{background:#f1f0ed;border-color:#d9d7d2}
.danger{color:#d13b3b!important}

.role-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:6px;
  margin-bottom:8px;
}
.role-btn{
  min-width:0;
  min-height:34px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
  padding:0 7px;
  text-align:center;
  font-size:11px;
  font-weight:750;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.role-btn.on{background:#111;color:#fff;border-color:#111}
.role-btn small{display:none}

.compact-group{
  display:flex;
  align-items:center;
  gap:6px;
  margin:7px 0 9px;
  overflow-x:auto;
  scrollbar-width:none;
}
.compact-group::-webkit-scrollbar{display:none}
.compact-group .chip{
  flex:0 0 auto;
  padding:8px 10px;
  border-radius:10px;
  font-size:12px;
}
.compact-divider{
  height:1px;
  background:var(--line);
  margin:8px 0;
}
.compact-line{
  display:flex;
  align-items:center;
  gap:7px;
  margin:7px 0;
}
.compact-label{
  width:38px;
  flex:0 0 auto;
  font-size:11px;
  color:#8a8a8f;
  font-weight:700;
}
.compact-fill{flex:1;min-width:0}
.icon-chip{
  width:36px;
  height:36px;
  padding:0;
  display:grid;
  place-items:center;
  border:1px solid var(--line);
  background:#fff;
  border-radius:10px;
  font-size:15px;
}
.icon-chip.danger{color:#d13b3b}
.sheet-title{
  font-size:14px;
  font-weight:800;
  margin-bottom:8px;
}
.sheet .label{
  display:none;
}

.details{display:none;border-top:1px solid var(--line);margin-top:8px;padding-top:4px}
.details.show{display:block}
.select{
  width:100%;height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 12px
}
.range-line{display:grid;grid-template-columns:90px 1fr 44px;align-items:center;gap:8px;margin-bottom:10px;font-size:12px}
.range-line input{width:100%}

.text-color-control{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.recent-color-chip,.eyedropper-btn{
  width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;
  display:grid;place-items:center;flex:0 0 auto;padding:0
}
.recent-color-dot{width:24px;height:24px;border-radius:7px;border:1px solid rgba(0,0,0,.12);box-shadow:0 0 0 2px #fff inset}
.text-color-picker{
  flex:1;height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;
  display:flex;align-items:center;gap:10px;padding:0 10px 0 12px
}
.text-color-picker span{font-size:13px;font-weight:700;color:#555}
.text-color-picker input[type=color]{margin-left:auto;width:38px;height:30px;padding:0;border:0;background:transparent}
.text-color-picker input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.text-color-picker input[type=color]::-webkit-color-swatch{border:1px solid #d7d7da;border-radius:8px}
.eyedropper-icon{width:18px;height:18px;display:block;position:relative}
.eyedropper-icon::before{
  content:"";position:absolute;width:6px;height:14px;left:6px;top:1px;border:2px solid #111;
  border-radius:2px 2px 4px 4px;transform:rotate(45deg)
}
.eyedropper-icon::after{
  content:"";position:absolute;width:7px;height:2px;left:1px;bottom:1px;background:#111;
  border-radius:2px;transform:rotate(-45deg)
}

.manager-list{display:flex;flex-direction:column;gap:6px}
.manager-card{
  border:1px solid var(--line);
  border-radius:13px;
  background:#fff;
  overflow:hidden;
}
.manager-head{
  min-height:48px;
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px 9px 8px 12px;
}
.manager-title{
  font-size:13px;
  font-weight:800;
  flex:1;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.manager-swatch{
  width:18px;
  height:18px;
  border-radius:6px;
  border:1px solid rgba(0,0,0,.12);
  flex:0 0 auto;
}
.gear-btn{
  width:30px;
  height:30px;
  flex:0 0 auto;
  border:0;
  border-radius:9px;
  background:transparent;
  color:#666;
  display:grid;
  place-items:center;
  padding:0;
  font-size:16px;
  line-height:1;
}
.gear-btn:active,.gear-btn.on{background:#f1f0ed;color:#111}
.manager-editor{
  display:none;
  border-top:1px solid var(--line);
  padding:10px 12px 12px;
  background:#fcfbfa;
}
.manager-editor.show{display:block}
.manager-controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-bottom:10px;
}
.manager-controls .chip{
  width:100%;
  padding:8px 9px;
  font-size:12px;
}
.manager-section-toggle{
  width:100%;
  min-height:42px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  font-size:12px;
  font-weight:800;
  color:#444;
  margin-bottom:8px;
}
.manager-section-body{
  display:none;
  padding:2px 0 8px;
}
.manager-section-body.show{display:block}
.npc-row{display:flex;gap:7px;margin-bottom:7px}
.npc-row input{
  flex:1;
  height:38px;
  border:1px solid var(--line);
  border-radius:11px;
  padding:0 11px;
  font-size:13px;
}
.mini-btn{
  width:38px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#fff
}

.toast{
  position:fixed;z-index:120;left:50%;bottom:92px;transform:translateX(-50%) translateY(10px);
  background:rgba(28,28,30,.92);color:#fff;padding:9px 13px;border-radius:999px;font-size:13px;opacity:0;transition:.16s
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.color-image-modal{
  position:fixed;inset:0;z-index:100;display:none;background:rgba(0,0,0,.82);
  padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))
}
.color-image-modal.show{display:flex;flex-direction:column}
.color-image-topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.color-image-title{color:#fff;font-size:14px;font-weight:800}
.color-image-close,.color-image-choose{
  height:38px;border:0;border-radius:11px;padding:0 12px;font-size:13px;font-weight:800
}
.color-image-close{background:rgba(255,255,255,.12);color:#fff}
.color-image-choose{background:#fff;color:#111}
.color-image-stage{flex:1;min-height:0;border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#111;position:relative}
#colorImageCanvas{max-width:100%;max-height:100%;display:block;touch-action:none}
.color-sample{position:absolute;width:48px;height:48px;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 14px rgba(0,0,0,.35);pointer-events:none;display:none;transform:translate(-50%,-50%)}
.color-image-hint{color:rgba(255,255,255,.75);font-size:12px;text-align:center;padding-top:10px}

@media(max-width:600px){
  .canvas.novel{min-height:820px}
    .novel .block{font-size:18px}
}

/* ultra compact mobile refinements */
.sheet{
  padding-left:12px;
  padding-right:12px;
}
.compact-divider{
  margin:6px 0;
}
.compact-line{
  gap:6px;
  margin:5px 0;
}
.compact-label{
  width:34px;
  font-size:10px;
}
.compact-group{
  gap:5px;
  margin:4px 0 6px;
}
.compact-group .chip{
  padding:7px 9px;
  font-size:11px;
}
.subtle-btn{
  min-height:32px;
  padding:0 10px;
  font-size:11px;
}
.icon-chip{
  width:32px;
  height:32px;
  border-radius:9px;
  font-size:14px;
}
.role-manager-list{
  display:flex;
  flex-direction:column;
  gap:4px;
}
.role-manager-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 18px 28px;
  align-items:center;
  gap:8px;
  min-height:38px;
  padding:4px 6px 4px 10px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
}
.role-manager-name{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:12px;
  font-weight:800;
}
.role-manager-row .manager-swatch{
  width:16px;
  height:16px;
  border-radius:5px;
}
.role-manager-row .gear-btn{
  width:28px;
  height:28px;
  font-size:14px;
  border-radius:8px;
}
.role-popover{
  margin-top:4px;
  padding:8px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fbfaf8;
}
.role-popover-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  margin-bottom:7px;
}
.role-popover-grid .chip{
  padding:7px 5px;
  font-size:11px;
}
.role-popover .range-line{
  grid-template-columns:34px 1fr 34px;
  margin:4px 0 7px;
  font-size:10px;
}
.role-popover .text-color-control{
  gap:6px;
  margin-bottom:0;
}
.role-popover .recent-color-chip,
.role-popover .eyedropper-btn{
  width:34px;
  height:34px;
  border-radius:9px;
}
.role-popover .recent-color-dot{
  width:19px;
  height:19px;
}
.role-popover .text-color-picker{
  height:34px;
  border-radius:9px;
  padding-left:9px;
}
.role-popover .text-color-picker span{
  font-size:11px;
}
.role-popover .text-color-picker input[type=color]{
  width:30px;
  height:24px;
}
.npc-inline{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  margin-bottom:6px;
}
.npc-pill{
  display:flex;
  align-items:center;
  gap:4px;
  height:32px;
  border:1px solid var(--line);
  border-radius:9px;
  padding:0 7px;
  background:#fff;
}
.npc-pill input{
  width:74px;
  border:0;
  outline:0;
  background:transparent;
  font-size:11px;
  font-weight:700;
}
.npc-pill button{
  width:20px;
  height:20px;
  border:0;
  background:transparent;
  color:#c44;
  font-size:14px;
  padding:0;
}
@media(max-width:420px){
  .role-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

/* preset manager: actually use horizontal space */
.role-manager-list{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:6px;
}
.role-manager-item{
  min-width:0;
}
.role-manager-item.open{
  grid-column:1 / -1;
}
.role-manager-row{
  grid-template-columns:minmax(0,1fr) 16px 26px;
  min-height:36px;
  padding:3px 5px 3px 9px;
  border-radius:9px;
}
.role-manager-name{
  font-size:11px;
}
.role-manager-row .manager-swatch{
  width:14px;
  height:14px;
  border-radius:4px;
}
.role-manager-row .gear-btn{
  width:25px;
  height:25px;
  font-size:13px;
}
.role-popover{
  margin-top:5px;
  padding:7px;
  border-radius:9px;
}
.role-popover-grid{
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:4px;
}
.role-popover-grid .chip{
  min-width:0;
  padding:6px 4px;
  font-size:10px;
}
@media(max-width:380px){
  .role-manager-list{
    grid-template-columns:1fr;
  }
  .role-manager-item.open{
    grid-column:auto;
  }
}

.novel-tools{display:none!important}

/* Role preset cards: select + attached gear */
.role-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:6px;
  margin-bottom:8px;
}
.role-preset-card{
  min-width:0;
  height:36px;
  display:grid;
  grid-template-columns:minmax(0,1fr) 30px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
  overflow:hidden;
}
.role-preset-card.selected{
  background:#111;
  border-color:#111;
}
.role-preset-select{
  min-width:0;
  border:0;
  background:transparent;
  color:#222;
  padding:0 5px 0 10px;
  text-align:left;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.role-preset-card.selected .role-preset-select{
  color:#fff;
}
.role-preset-gear{
  border:0;
  border-left:1px solid var(--line);
  background:transparent;
  color:#777;
  padding:0;
  font-size:13px;
  display:grid;
  place-items:center;
}
.role-preset-card.selected .role-preset-gear{
  border-left-color:rgba(255,255,255,.18);
  color:#ddd;
}
.role-preset-gear.on{
  background:#f0efec;
  color:#111;
}
.role-preset-card.selected .role-preset-gear.on{
  background:#333;
  color:#fff;
}
.role-add-card{
  height:36px;
  border:1px dashed #d5d3ce;
  border-radius:10px;
  background:#faf9f7;
  color:#777;
  font-size:18px;
  font-weight:500;
}
.inline-preset-editor{
  grid-column:1 / -1;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fbfaf8;
  padding:8px;
  margin-top:0;
}
.inline-preset-editor .preset-name-input{
  width:100%;
  height:32px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff;
  padding:0 9px;
  margin-bottom:7px;
  font-size:11px;
  font-weight:700;
}
.inline-preset-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:5px;
  margin-bottom:7px;
}
.inline-preset-grid .chip{
  min-width:0;
  padding:6px 4px;
  font-size:10px;
}
.inline-preset-editor .range-line{
  grid-template-columns:34px 1fr 34px;
  margin:4px 0 7px;
  font-size:10px;
}
.inline-preset-editor .text-color-control{
  gap:6px;
  margin-bottom:0;
}
.inline-preset-editor .recent-color-chip,
.inline-preset-editor .eyedropper-btn{
  width:34px;
  height:34px;
  border-radius:9px;
}
.inline-preset-editor .recent-color-dot{
  width:19px;
  height:19px;
}
.inline-preset-editor .text-color-picker{
  height:34px;
  border-radius:9px;
  padding-left:9px;
}
.inline-preset-editor .text-color-picker span{
  font-size:11px;
}
.inline-preset-editor .text-color-picker input[type=color]{
  width:30px;
  height:24px;
}
@media(max-width:360px){
  .role-grid{grid-template-columns:1fr}
}

.novel .role-tag{
  cursor:pointer;
  touch-action:manipulation;
}
.novel .role-tag:active{
  opacity:.55;

function legacyDemoHash(value){
  let h=0x811c9dc5;
  const s=String(value??'').replace(/["〃˝＂“”]/g,'').trim();
  for(let i=0;i<s.length;i++){
    h^=s.charCodeAt(i);
    h=Math.imul(h,0x01000193)>>>0;
  }
  return h>>>0;
}

function migrateLegacyDemoContent(){
  if(!Array.isArray(state.novel)||!state.novel.length)return false;

  const legacyHashes=new Set([489182607, 3299701221, 4195064259, 4064065577, 3807152594, 2366936984]);
  const hits=state.novel.reduce((count,p)=>count+(legacyHashes.has(legacyDemoHash(p?.text))?1:0),0);

  // Replace only the old bundled demo. User-authored writing remains untouched.
  if(hits>=2){
    state.novel=[
      {id:id(),text:'더블엔터 = 문단나누기 / <-backspace = 문단합치기 / 왼쪽 칩 클릭 = 설정창 열기 / 스포이드로 추출하고 팔레트에 담긴 색을 꾹 누르면 삭제됨 / 프리셋 누르고 팔레트 클릭 하면 해당 색으로 변경 가능',role:'common',effect:'none',override:{}}
    ];
    state.selectedId=null;
    state.activeEditId=null;
    state.openPresetKey=null;
    return true;
  }
  return false;
}

      text:String(p?.text??''),

      effect:['none','emphasis','quote','highlight'].includes(p?.effect)?p.effect:'none',

    };

    ? state.replacements
        .map(r=>({id:r?.id||id(),find:String(r?.find??''),replace:String(r?.replace??'')}))
        .filter(r=>r.find)

    state.pageBackground={type:'solid',color1:'#f4f4f2',color2:'#ffffff',direction:'down',image:'',opacity:1};
  }
}

const STORAGE_KEY='excerpt_unified_state_v1';
const STATE_DB_NAME='excerpt_studio';
const STATE_DB_STATE_STORE='state';
const STATE_DB_ASSET_STORE='assets';
const STATE_DB_KEY='main';
let persistTimer=null;
let stateDbPromise=null;
const lastSavedAssets=new Map();

function buildPersistedState(){
  return {
    version:3,
    savedAt:Date.now(),
    exportRatio:state.exportRatio,
    verticalAlign:state.verticalAlign,
    novelFontSize:state.novelFontSize,
    novelLetterSpacing:state.novelLetterSpacing,
    novelLineHeight:state.novelLineHeight,
    novelMarginTop:state.novelMarginTop,
    novelMarginRight:state.novelMarginRight,
    novelMarginBottom:state.novelMarginBottom,
    novelMarginLeft:state.novelMarginLeft,
    creditText:state.creditText,
    highlightColor:state.highlightColor,
    highlightOpacity:state.highlightOpacity,
    savedColors:state.savedColors,
    replacements:state.replacements,
    npcs:state.npcs,
    rolePresets:state.rolePresets,
    npcPresets:state.npcPresets,
    customRolePresets:state.customRolePresets,
    pageBackground:state.pageBackground,
    novel:state.novel
  };
}

function assetKeyForPreset(group,key,part=''){
  return `profile:${group}:${key}${part?':'+part:''}`;
}

function splitPersistedAssets(payload){
  const clean={
    ...payload,
    rolePresets:{},
    customRolePresets:{},
    npcPresets:{},
    pageBackground:{...(payload.pageBackground||{})}
  };
  const assets=new Map();

  if(clean.pageBackground.image){
    const key='background:page';
    assets.set(key,clean.pageBackground.image);
    clean.pageBackground.image='';
    clean.pageBackground.imageAssetKey=key;
  }else{
    clean.pageBackground.image='';
    clean.pageBackground.imageAssetKey='';
  }

  Object.entries(payload.rolePresets||{}).forEach(([key,preset])=>{
    const copy={...preset};
    if(copy.profileImage){
      const assetKey=assetKeyForPreset('role',key);
      assets.set(assetKey,copy.profileImage);
      copy.profileAssetKey=assetKey;
    }else{
      copy.profileAssetKey='';
    }
    copy.profileImage='';
    clean.rolePresets[key]=copy;
  });

  Object.entries(payload.customRolePresets||{}).forEach(([key,preset])=>{
    const copy={...preset};
    if(copy.profileImage){
      const assetKey=assetKeyForPreset('custom',key);
      assets.set(assetKey,copy.profileImage);
      copy.profileAssetKey=assetKey;
    }else{
      copy.profileAssetKey='';
    }
    copy.profileImage='';
    clean.customRolePresets[key]=copy;
  });

  Object.entries(payload.npcPresets||{}).forEach(([npcKey,pair])=>{
    const nextPair={};
    ['dialogue','action'].forEach(part=>{
      const copy={...(pair?.[part]||{})};
      if(copy.profileImage){
        const assetKey=assetKeyForPreset('npc',npcKey,part);
        assets.set(assetKey,copy.profileImage);
        copy.profileAssetKey=assetKey;
      }else{
        copy.profileAssetKey='';
      }
      copy.profileImage='';
      nextPair[part]=copy;
    });
    clean.npcPresets[npcKey]=nextPair;
  });

  return {clean,assets};
}

function buildLightweightFallback(payload){
  return splitPersistedAssets(payload).clean;
}

function applyPersistedState(data){
  if(!data||typeof data!=='object')return false;
  [
    'exportRatio','verticalAlign','novelFontSize','novelLetterSpacing','novelLineHeight',
    'novelMarginTop','novelMarginRight','novelMarginBottom','novelMarginLeft',
    'creditText','highlightColor','highlightOpacity',
    'savedColors','replacements','npcs','rolePresets','npcPresets','customRolePresets',
    'pageBackground','novel'
  ].forEach(key=>{
    if(data[key]!==undefined)state[key]=data[key];
  });
  return true;
}

function openStateDb(){
  if(!('indexedDB' in window))return Promise.reject(new Error('IndexedDB unavailable'));
  if(stateDbPromise)return stateDbPromise;

  stateDbPromise=new Promise((resolve,reject)=>{
    const req=indexedDB.open(STATE_DB_NAME,2);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(STATE_DB_STATE_STORE)){
        db.createObjectStore(STATE_DB_STATE_STORE);
      }
      if(!db.objectStoreNames.contains(STATE_DB_ASSET_STORE)){
        db.createObjectStore(STATE_DB_ASSET_STORE);
      }
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error('IndexedDB open failed'));
    req.onblocked=()=>console.warn('IndexedDB upgrade blocked by another open tab');
  });
  return stateDbPromise;
}

async function saveStateToDb(payload){
  const {clean,assets}=splitPersistedAssets(payload);
  const db=await openStateDb();

  await new Promise((resolve,reject)=>{
    const tx=db.transaction([STATE_DB_STATE_STORE,STATE_DB_ASSET_STORE],'readwrite');
    const stateStore=tx.objectStore(STATE_DB_STATE_STORE);
    const assetStore=tx.objectStore(STATE_DB_ASSET_STORE);

    stateStore.put(clean,STATE_DB_KEY);

    // Large images are only rewritten when their value actually changes.
    assets.forEach((value,key)=>{
      if(lastSavedAssets.get(key)!==value){
        assetStore.put(value,key);
        lastSavedAssets.set(key,value);
      }
    });

    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error||new Error('IndexedDB save failed'));
    tx.onabort=()=>reject(tx.error||new Error('IndexedDB save aborted'));
  });
}

async function readAsset(store,key){
  if(!key)return '';
  return await new Promise((resolve,reject)=>{
    const req=store.get(key);
    req.onsuccess=()=>resolve(req.result||'');
    req.onerror=()=>reject(req.error||new Error('Asset read failed'));
  });
}

async function hydrateStoredAssets(data,db){
  if(!data||!db.objectStoreNames.contains(STATE_DB_ASSET_STORE))return data;

  const tx=db.transaction(STATE_DB_ASSET_STORE,'readonly');
  const store=tx.objectStore(STATE_DB_ASSET_STORE);
  const pending=[];

  if(data.pageBackground?.imageAssetKey && !data.pageBackground.image){
    pending.push(
      readAsset(store,data.pageBackground.imageAssetKey).then(value=>{
        data.pageBackground.image=value;
        if(value)lastSavedAssets.set(data.pageBackground.imageAssetKey,value);
      })
    );
  }

  const hydratePresetMap=(map)=>{
    Object.values(map||{}).forEach(preset=>{
      if(preset?.profileAssetKey && !preset.profileImage){
        pending.push(
          readAsset(store,preset.profileAssetKey).then(value=>{
            preset.profileImage=value;
            if(value)lastSavedAssets.set(preset.profileAssetKey,value);
          })
        );
      }
    });
  };

  hydratePresetMap(data.rolePresets);
  hydratePresetMap(data.customRolePresets);
  Object.values(data.npcPresets||{}).forEach(pair=>{
    hydratePresetMap({dialogue:pair?.dialogue,action:pair?.action});
  });

  await Promise.all(pending);
  return data;
}

async function loadStateFromDb(){
  try{
    const db=await openStateDb();
    const data=await new Promise((resolve,reject)=>{
      const tx=db.transaction(STATE_DB_STATE_STORE,'readonly');
      const req=tx.objectStore(STATE_DB_STATE_STORE).get(STATE_DB_KEY);
      req.onsuccess=()=>resolve(req.result||null);
      req.onerror=()=>reject(req.error||new Error('IndexedDB read failed'));
    });
    return data ? await hydrateStoredAssets(data,db) : null;
  }catch(e){
    return null;
  }
}

function persistNow(){
  const payload=buildPersistedState();

  // Small emergency fallback. Images are deliberately omitted.
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(buildLightweightFallback(payload)));
  }catch(e){
    console.warn('Fallback save skipped',e);
  }

  // Primary store. Structured data and large image assets live separately.
  saveStateToDb(payload).catch(e=>console.warn('IndexedDB save skipped',e));
}

function queuePersist(delay=160){
  clearTimeout(persistTimer);
  persistTimer=setTimeout(persistNow,delay);
}

function loadFallbackState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return false;
    return applyPersistedState(JSON.parse(raw));
  }catch(e){
    console.warn('Fallback load skipped',e);
    return false;
  }
}

async function hydratePrimaryState(){
  const data=await loadStateFromDb();
  if(!data)return false;
  applyPersistedState(data);
  migrateLegacyDemoContent();
  sanitizeStateStructure();
  ensureNpcPresets();
  return true;
}

const profileCropModal=document.getElementById('profileCropModal');
const profileCropCanvas=document.getElementById('profileCropCanvas');
const profileCropCtx=profileCropCanvas.getContext('2d');
const profileCropZoom=document.getElementById('profileCropZoom');
let profileCropTarget=null;
let profileCropImage=null;
let profileCropBaseScale=1;
let profileCropScale=1;
let profileCropX=0;
let profileCropY=0;
let profileCropDragging=false;
let profileCropLastX=0;
let profileCropLastY=0;

function drawProfileCrop(){
  if(!profileCropImage)return;
  const size=profileCropCanvas.width;
  profileCropCtx.clearRect(0,0,size,size);
  profileCropCtx.fillStyle='#eee';
  profileCropCtx.fillRect(0,0,size,size);

  const w=profileCropImage.naturalWidth*profileCropScale;
  const h=profileCropImage.naturalHeight*profileCropScale;

  const minX=size-w;
  const minY=size-h;
  profileCropX=Math.min(0,Math.max(minX,profileCropX));
  profileCropY=Math.min(0,Math.max(minY,profileCropY));

  profileCropCtx.drawImage(profileCropImage,profileCropX,profileCropY,w,h);
}

function openProfileCrop(file,preset){
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      profileCropTarget=preset;
      profileCropImage=img;

      const size=profileCropCanvas.width;
      profileCropBaseScale=Math.max(size/img.naturalWidth,size/img.naturalHeight);
      profileCropScale=profileCropBaseScale;
      profileCropZoom.value='1';

      const w=img.naturalWidth*profileCropScale;
      const h=img.naturalHeight*profileCropScale;
      profileCropX=(size-w)/2;
      profileCropY=(size-h)/2;

      drawProfileCrop();
      profileCropModal.classList.add('show');
      profileCropModal.setAttribute('aria-hidden','false');
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}

function closeProfileCrop(){
  profileCropModal.classList.remove('show');
  profileCropModal.setAttribute('aria-hidden','true');
  profileCropTarget=null;
  profileCropImage=null;
  profileCropDragging=false;
}

profileCropZoom.addEventListener('input',()=>{
  if(!profileCropImage)return;
  const size=profileCropCanvas.width;
  const oldW=profileCropImage.naturalWidth*profileCropScale;
  const oldH=profileCropImage.naturalHeight*profileCropScale;
  const centerX=(size/2-profileCropX)/oldW;
  const centerY=(size/2-profileCropY)/oldH;

  profileCropScale=profileCropBaseScale*Number(profileCropZoom.value);

  const newW=profileCropImage.naturalWidth*profileCropScale;
  const newH=profileCropImage.naturalHeight*profileCropScale;
  profileCropX=size/2-centerX*newW;
  profileCropY=size/2-centerY*newH;
  drawProfileCrop();
});

profileCropCanvas.addEventListener('pointerdown',e=>{
  if(!profileCropImage)return;
  profileCropDragging=true;
  profileCropLastX=e.clientX;
  profileCropLastY=e.clientY;
  profileCropCanvas.setPointerCapture?.(e.pointerId);
});
profileCropCanvas.addEventListener('pointermove',e=>{
  if(!profileCropDragging)return;
  const rect=profileCropCanvas.getBoundingClientRect();
  const sx=profileCropCanvas.width/rect.width;
  const sy=profileCropCanvas.height/rect.height;
  profileCropX+=(e.clientX-profileCropLastX)*sx;
  profileCropY+=(e.clientY-profileCropLastY)*sy;
  profileCropLastX=e.clientX;
  profileCropLastY=e.clientY;
  drawProfileCrop();
});
profileCropCanvas.addEventListener('pointerup',()=>profileCropDragging=false);
profileCropCanvas.addEventListener('pointercancel',()=>profileCropDragging=false);

document.getElementById('profileCropCancel').onclick=closeProfileCrop;
document.getElementById('profileCropApply').onclick=()=>{
  if(!profileCropTarget||!profileCropImage)return;

  const out=document.createElement('canvas');
  out.width=512;
  out.height=512;
  const ctx=out.getContext('2d');

  // Reproduce the visible crop at full output resolution.
  const k=512/profileCropCanvas.width;
  ctx.drawImage(
    profileCropImage,
    profileCropX*k,
    profileCropY*k,
    profileCropImage.naturalWidth*profileCropScale*k,
    profileCropImage.naturalHeight*profileCropScale*k
  );

  profileCropTarget.profileImage=out.toDataURL('image/jpeg',.92);
  closeProfileCrop();
  render();
  openSheet();
};

function roleLabel(role){
  if(role==='pc-dialogue')return 'PC 대사';
  if(role==='pc-action')return 'PC 지문';
  if(role==='common')return '공통지문';

  if((role||'').startsWith('custom:')){
    return state.customRolePresets[role]?.label || '사용자 프리셋';
  }

  const m=/^npc:([^:]+):(dialogue|action)$/.exec(role||'');
  if(m){
    const npc=state.npcs.find(n=>n.id===m[1]);
    return `${npc?.name||'NPC'} ${m[2]==='dialogue'?'대사':'지문'}`;
  }
  return '역할 없음';
}

function roleChipLabel(role){
  if(role==='common')return '공통';
  if(role==='pc-dialogue')return 'PC';
  if(role==='pc-action')return 'PC·지';

  if((role||'').startsWith('custom:')){
    const label=String(state.customRolePresets[role]?.label||'사용자').trim();
    return label.length>4?label.slice(0,4):label;
  }

  const m=/^npc:([^:]+):(dialogue|action)$/.exec(role||'');
  if(m){
    const npc=state.npcs.find(n=>n.id===m[1]);
    const base=String(npc?.name||'NPC').replace(/\s+/g,'');
    return m[2]==='action'?`${base}지`:base;
  }
  return '역할';
}

function getRolePreset(role){
  if(state.rolePresets[role])return state.rolePresets[role];
  if(state.customRolePresets[role])return state.customRolePresets[role];

  const m=/^npc:([^:]+):(dialogue|action)$/.exec(role||'');
  if(m)return state.npcPresets[m[1]]?.[m[2]] || null;
  return null;
}

}

function applyTextReplacements(value){
  let out=String(value??'');
  (state.replacements||[]).forEach(rule=>{
    const find=String(rule?.find??'');
    if(!find)return;
    out=out.split(find).join(String(rule?.replace??''));
  });
  return out;
}

function normalizeCurrentRoleQuotes(role){

}

  {key:'literary', label:'문학체', css:'"Hahmlet",serif'},

const QUOTE_CHARS_RE=/["〃˝＂“”]/g;
function stripNovelQuoteChars(value){
  return String(value||'').replace(QUOTE_CHARS_RE,'').trim();
}
function stripNovelQuoteCharsKeepLayout(value){
  return String(value??'').replace(QUOTE_CHARS_RE,'');
}

function effectClass(effect){
  if(effect==='emphasis')return 'effect-emphasis';
  if(effect==='quote')return 'effect-quote';
  return '';
}



function ratioLabel(){
  return state.exportRatio==='1:1'?'정방형':state.exportRatio;
}

function applyPreviewRatio(page){
  page.style.aspectRatio=state.exportRatio==='1:1'?'1 / 1':state.exportRatio.replace(':',' / ');
  page.style.display='flex';
  page.style.flexDirection='column';
  page.style.justifyContent='flex-start';
}

function pageGradientCss(){
  const bg=state.pageBackground;
  const dirs={
    right:'to right',
    downRight:'to bottom right',
    down:'to bottom',
    downLeft:'to bottom left'
  };
  return `linear-gradient(${dirs[bg.direction]||'to bottom'}, ${bg.color1}, ${bg.color2})`;
}

function applyPageBackgroundPreview(page){
  const bg=state.pageBackground;
  let layer=page.querySelector(':scope > .page-bg-layer');
  if(!layer){
    layer=document.createElement('div');
    layer.className='page-bg-layer';
    page.prepend(layer);
  }

  page.style.backgroundImage='none';
  page.style.backgroundColor='transparent';
  page.style.backgroundSize='';
  page.style.backgroundPosition='';

  layer.style.opacity=String(Math.max(0,Math.min(1,Number(bg.opacity ?? 1))));

  if(bg.type==='image'&&bg.image){
    layer.style.backgroundImage=`url("${bg.image}")`;
    layer.style.backgroundColor=bg.color1;
    layer.style.backgroundSize='cover';
    layer.style.backgroundPosition='center';
  }else if(bg.type==='gradient'){
    layer.style.backgroundImage=pageGradientCss();
    layer.style.backgroundColor=bg.color1;
    layer.style.backgroundSize='';
    layer.style.backgroundPosition='';
  }else{
    layer.style.backgroundImage='none';
    layer.style.backgroundColor=bg.color1;
    layer.style.backgroundSize='';
    layer.style.backgroundPosition='';
  }
}

function createPreviewPage(pageIndex){
  const page=document.createElement('section');
  page.className='canvas novel preview-page';
  page.dataset.pageLabel=String(pageIndex+1);

  const margins=currentMarginKeys();
  page.style.padding=`${state[margins.top]}% ${state[margins.right]}% ${state[margins.bottom]}% ${state[margins.left]}%`;
  applyPreviewRatio(page);
  canvas.appendChild(page);
  applyPageBackgroundPreview(page);

  requestAnimationFrame(()=>{
    const pageW=page.clientWidth;
    const leftPad=pageW*(state[margins.left]/100);
    page.style.setProperty('--role-chip-page-offset',`${leftPad+6}px`);
  });

  return page;
}

function previewPageOverflows(page){
  return page.scrollHeight > page.clientHeight + 1;
}


function layoutRoleChipRail(){
  let rail=canvas.querySelector(':scope > .role-chip-rail');
  if(!rail){
    rail=document.createElement('div');
    rail.className='role-chip-rail';
    canvas.appendChild(rail);
  }
  rail.innerHTML='';

  const hostRect=canvas.getBoundingClientRect();

  canvas.querySelectorAll('.preview-page .block').forEach(block=>{
    const sourceTag=block.querySelector(':scope > .role-tag');
    if(!sourceTag)return;

    const clone=sourceTag.cloneNode(true);
    clone.classList.add('role-tag-rail');

    const paragraphId=block.dataset.id;
    clone.onclick=e=>{
      e.preventDefault();
      e.stopPropagation();
      const item=currentList().find(x=>x.id===paragraphId);
      if(!item)return;
      state.selectedId=item.id;
      state.sheetMode='block';
      state.showDetails=false;
      state.openPresetKey=item.role;
      render();
      openSheet();
    };

    const br=block.getBoundingClientRect();
    clone.style.top=`${br.top-hostRect.top+1}px`;
    rail.appendChild(clone);
    sourceTag.style.visibility='hidden';
  });
}

function finalizePreviewPageAlignment(){
  canvas.querySelectorAll('.preview-page').forEach(page=>{
    page.style.justifyContent=
      state.verticalAlign==='middle'?'center':
      state.verticalAlign==='bottom'?'flex-end':
      'flex-start';
  });
}



function resolvedCreditText(){
  return String(state.creditText||'').trim();
}

function render(){  document.querySelector('.canvas-shell')?.classList.add('novel-editing');
  canvas.className='canvas-pages';
  canvas.innerHTML='';

  let pageIndex=0;
  let page=createPreviewPage(pageIndex);

  const appendPaginated=(node,paragraphId=null)=>{
    page.appendChild(node);

    if(previewPageOverflows(page)){
      const itemCount=page.querySelectorAll(':scope > .block, :scope > .credit-paragraph').length;

      // Pagination is paragraph-only:
      // if the whole paragraph does not fit, move the whole block to the next page.
      // Paragraph text is never split into line fragments automatically.
      if(itemCount>1){
        page.removeChild(node);
        pageIndex+=1;
        page=createPreviewPage(pageIndex);
        page.appendChild(node);
      }

      // If one paragraph itself is taller than a full page, keep it as one
      // paragraph and ask the user to divide it manually.
      if(previewPageOverflows(page) && node.classList.contains('block')){
        node.classList.add('oversize-paragraph');
        page.classList.add('has-oversize-paragraph');
      }
    }

    node.dataset.previewPage=String(pageIndex);
    if(paragraphId){
      const item=currentList().find(x=>x.id===paragraphId);
      if(item)item.previewPage=pageIndex;
    }
  };

  currentList().forEach(p=>{
    const wrap=document.createElement('div');
    const st=currentComputedStyle(p);
    wrap.className='block '+st.align+' '+effectClass(p.effect)+(state.selectedId===p.id?' selected':'');
    wrap.dataset.id=p.id;
    wrap.style.color=st.color;
    wrap.style.fontWeight=st.bold?'800':'500';
    wrap.style.fontStyle=st.italic?'italic':'normal';
    wrap.style.fontSize=`${Math.round(state[currentFontSizeKey()] * fontScale(st.font))}px`;
    wrap.style.fontFamily=fontCss(st.font);
    wrap.style.letterSpacing=`${state.novelLetterSpacing}em`;
    wrap.style.lineHeight=String(state.novelLineHeight);

    const tag=document.createElement('div');
    tag.className='role-tag';
    tag.textContent=roleChipLabel(p.role);
    tag.title=currentRoleLabel(p.role);
    tag.contentEditable='false';

    const body=document.createElement('div');
    body.className='block-text';
    body.contentEditable='true';
    body.spellcheck=false;
    const shown=currentDisplayText(p);
    if(p.effect==='highlight'){
      const span=document.createElement('span');
      span.className='highlight-text';
      span.textContent=shown;
      const hc=state.highlightColor||'#f3dfc5';
      const hr=parseInt(hc.slice(1,3),16),hg=parseInt(hc.slice(3,5),16),hb=parseInt(hc.slice(5,7),16);
      span.style.backgroundColor=`rgba(${hr},${hg},${hb},${state.highlightOpacity})`;
      body.appendChild(span);
    }else{
      body.textContent=shown;
    }

    body.addEventListener('input',()=>{
      const value=body.innerText;
      /* 이름은 본문과 분리 표시 */
      p.text=stripNovelQuoteCharsKeepLayout(value);
      queuePersist();
    });
    body.addEventListener('compositionend',()=>{
      p.text=stripNovelQuoteCharsKeepLayout(body.innerText);
      queuePersist(60);
    });
    body.addEventListener('focus',()=>{state.activeEditId=p.id;});
    body.addEventListener('keydown',e=>{
      // iPhone/iPad Korean IME can emit keydown while composition is active.
      // Never hijack Enter/Backspace during that phase.
      if(e.isComposing||e.keyCode===229)return;
      if(e.key==='Enter'){
        e.preventDefault();
        insertSoftLineBreak(p.id,body);
        return;
      }
      if(e.key==='Backspace'&&caretIsAtStart(body)){
        const arr=currentList();
        const idx=arr.findIndex(x=>x.id===p.id);
        if(idx>0){e.preventDefault();mergeCurrentParagraph(p.id,-1);}
      }
    });
    body.addEventListener('paste',e=>{
      e.preventDefault();

      const rawClipboard=(e.clipboardData||window.clipboardData)?.getData('text/plain')
        ||(e.clipboardData||window.clipboardData)?.getData('text')||'';

      const normalized=String(rawClipboard)
        .replace(/\r\n?/g,'\n')
        .replace(/\u00a0/g,' ');

      if(!normalized)return;

      // 빈 줄만 문단 경계. 한 번 개행은 같은 문단 안에서 유지.
      const chunks=normalized
        .split(/\n[ \t]*\n+/)
        .map(chunk=>chunk.replace(/^[ \t]+|[ \t]+$/g,''))
        .filter(chunk=>chunk.length>0);

      if(!chunks.length)return;

      const arr=currentList();
      const idx=arr.findIndex(x=>x.id===p.id);
      if(idx<0)return;

      const {start,end}=caretTextOffsets(body);
      const current=String(p.text??'');
      const beforeText=current.slice(0,start);
      const afterText=current.slice(end);

      if(chunks.length===1){
        p.text=beforeText+chunks[0]+afterText;
        state.activeEditId=p.id;
        render();
        focusNovelParagraphAt(p.id,(beforeText+chunks[0]).length);
        return;
      }

      p.text=beforeText+chunks[0];

      const added=chunks.slice(1).map(t=>({
        id:id(),
        text:t,
        role:currentDefaultRole(),
        effect:'none',
        override:{}
      }));

      added[added.length-1].text+=afterText;
      arr.splice(idx+1,0,...added);

      state.activeEditId=added[added.length-1].id;
      render();
      focusNovelParagraphAt(
        added[added.length-1].id,
        chunks[chunks.length-1].length
      );
    });

    tag.addEventListener('click',e=>{
      e.preventDefault();e.stopPropagation();
      state.selectedId=p.id;
      state.sheetMode='block';
      state.showDetails=false;
      state.openPresetKey=p.role;
      render();
      openSheet();
    });

    wrap.appendChild(tag);
    const contentRow=document.createElement('div');
    contentRow.className='novel-content-row';
    const preset=getCurrentRolePreset(p.role)||{};
    if(st.align==='right'){
      contentRow.classList.add('profile-right');
    }
    const profile=currentPresetProfileImage(p.role);
    if(profile){
      const avatar=document.createElement('img');
      avatar.className='novel-profile';avatar.src=profile;avatar.alt='';avatar.contentEditable='false';
      const scale=Number(preset.profileScale)||1.55;
      avatar.style.width=`${scale}em`;
      avatar.style.height=`${scale}em`;
      avatar.style.flexBasis=`${scale}em`;
      contentRow.appendChild(avatar);
    }
    const textWrap=document.createElement('div');
    textWrap.className='novel-text-wrap';

    textWrap.classList.add('chat-text-wrap');
    const displayName=String(preset.name||'').trim();
    if(displayName){
      const nameEl=document.createElement('div');
      nameEl.className='chat-display-name';
      nameEl.textContent=displayName;
      nameEl.style.color=preset.nameColor||'#777777';
      nameEl.style.fontSize=`${Number(preset.nameScale)||0.62}em`;
      nameEl.contentEditable='false';
      textWrap.appendChild(nameEl);
    }
    if(preset.bubble){
      const bubbleStyle=preset.bubbleStyle||'rounded';
      body.classList.add('chat-bubble-text',`chat-bubble-${bubbleStyle}`);
      body.style.setProperty('--bubble-color',preset.bubbleColor||'#ffffff');
      body.style.background=(bubbleStyle==='outline')?'rgba(255,255,255,.72)':(preset.bubbleColor||'#ffffff');
      body.style.borderColor=preset.bubbleColor||'#ffffff';
    }

    textWrap.appendChild(body);
    contentRow.appendChild(textWrap);
    wrap.appendChild(contentRow);
    appendPaginated(wrap,p.id);
  });

  const creditValue=resolvedCreditText();
  if(creditValue){
    const cr=document.createElement('div');
    cr.className='credit credit-paragraph';
    cr.textContent=creditValue;
    cr.style.textAlign='right';
    appendPaginated(cr);
    state.previewCreditPage=pageIndex;
  }else{
    state.previewCreditPage=-1;
  }

  state.previewPageCount=pageIndex+1;
  finalizePreviewPageAlignment();
  requestAnimationFrame(layoutRoleChipRail);
  queuePersist();
}

function focusNovelParagraph(id){
  requestAnimationFrame(()=>{
    const target=document.querySelector(`[data-id="${id}"] .block-text`);
    if(!target)return;

    target.focus();

    const range=document.createRange();
    range.selectNodeContents(target);
    range.collapse(true);

    const sel=window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  });
}

function setCaretTextOffset(el,offset){
  const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
  let remain=Math.max(0,offset);
  let node;

  while((node=walker.nextNode())){
    if(remain<=node.nodeValue.length){
      const range=document.createRange();
      range.setStart(node,remain);
      range.collapse(true);
      const sel=window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      return;
    }
    remain-=node.nodeValue.length;
  }

  const range=document.createRange();
  range.selectNodeContents(el);
  range.collapse(false);
  const sel=window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}


function focusNovelParagraphAt(id,offset=0){
  requestAnimationFrame(()=>{
    const target=document.querySelector(`[data-id="${id}"] .block-text`);
    if(!target)return;
    target.focus();
    setCaretTextOffset(target,offset);
  });
}


function caretTextOffsets(el){
  const sel=window.getSelection();
  if(!sel||!sel.rangeCount)return {start:el.innerText.length,end:el.innerText.length};
  const range=sel.getRangeAt(0);
  if(!el.contains(range.startContainer)||!el.contains(range.endContainer)){
    const n=el.innerText.length;
    return {start:n,end:n};
  }

  const beforeStart=document.createRange();
  beforeStart.selectNodeContents(el);
  beforeStart.setEnd(range.startContainer,range.startOffset);

  const beforeEnd=document.createRange();
  beforeEnd.selectNodeContents(el);
  beforeEnd.setEnd(range.endContainer,range.endOffset);

  const a=beforeStart.toString().length;
  const b=beforeEnd.toString().length;
  return {start:Math.min(a,b),end:Math.max(a,b)};
}

function insertSoftLineBreak(blockId,el){
  const arr=currentList();
  const idx=arr.findIndex(x=>x.id===blockId);
  if(idx<0)return;

  const {start,end}=caretTextOffsets(el);
  const raw=String(arr[idx].text??'');

  // 두 번째 Enter: 직전 문자가 줄바꿈이면 그 빈 줄을 실제 문단 경계로 바꾼다.
  if(start===end && start>0 && raw[start-1]==='\n'){
    const left=raw.slice(0,start-1);
    const right=raw.slice(start);
    arr[idx].text=left;

    const next={
      id:id(),
      text:right,
      role:currentDefaultRole(),
      effect:'none',
      override:{}
    };
    arr.splice(idx+1,0,next);
    state.activeEditId=next.id;
    render();
    focusNovelParagraphAt(next.id,0);
    return;
  }

  // 첫 번째 Enter: 같은 문단 내부에 실제 줄바꿈만 삽입한다.
  arr[idx].text=raw.slice(0,start)+'\n'+raw.slice(end);
  state.activeEditId=arr[idx].id;
  render();
  focusNovelParagraphAt(arr[idx].id,start+1);
}

function caretIsAtStart(el){
  const sel=window.getSelection();
  if(!sel||!sel.rangeCount)return false;
  const range=sel.getRangeAt(0).cloneRange();
  if(!el.contains(range.startContainer))return false;
  const before=document.createRange();
  before.selectNodeContents(el);
  before.setEnd(range.startContainer,range.startOffset);
  return before.toString().length===0;
}

function mergeCurrentParagraph(blockId,direction){
  const arr=currentList();
  const idx=arr.findIndex(x=>x.id===blockId);
  if(idx<0)return;
  if(direction<0){
    if(idx===0)return;
    const prev=arr[idx-1],cur=arr[idx],seam=prev.text.length;
    prev.text+=cur.text;arr.splice(idx,1);state.activeEditId=prev.id;
    if(state.selectedId===cur.id)state.selectedId=null;
    render();closeSheet();focusNovelParagraphAt(prev.id,seam);return;
  }
  if(idx>=arr.length-1)return;
  const cur=arr[idx],next=arr[idx+1],seam=cur.text.length;
  cur.text+=next.text;arr.splice(idx+1,1);state.activeEditId=cur.id;
  if(state.selectedId===next.id)state.selectedId=null;
  render();closeSheet();focusNovelParagraphAt(cur.id,seam);
}

function roleOptions(){

  state.npcs.forEach(n=>{

function renderPresetSheet(p){
  sheetContent.innerHTML=`<div class="sheet-title">${false?'대화 설정':'문단 설정'}</div>`;

  const miniBtn=(label,on,fn,extra='')=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='mini-tool '+(on?'on ':'')+extra;
    b.textContent=label;
    b.onclick=fn;
    return b;
  };

  // 페이지 설정은 상단 툴바에서 조정

  {
    const bgLine=document.createElement('div');
    bgLine.className='compact-line chat-bg-line';
    const bgLabel=document.createElement('div');
    bgLabel.className='compact-label';
    bgLabel.textContent='배경';

    bgTools.className='flow-row compact-fill';
    const bg=state.pageBackground;

    const imageInput=document.createElement('input');
    imageInput.type='file';
    imageInput.accept='image/*';
    imageInput.hidden=true;
    imageInput.onchange=()=>{
      const file=imageInput.files?.[0];
      if(!file)return;
      const reader=new FileReader();
      reader.onload=()=>{
        bg.image=String(reader.result||'');

        imageInput.value='';

        openSheet();
      };
      reader.readAsDataURL(file);
    };

    bgTools.appendChild(chip('단색',bg.type==='solid',()=>{
      bg.type='solid';

function normalizeHexColor(hex){

function sampleColor(e){
  if(!colorImageCanvas.width)return;
  const rect=colorImageCanvas.getBoundingClientRect();
  const cx=e.clientX,cy=e.clientY;
  let x=(cx-rect.left)*(colorImageCanvas.width/rect.width);
  let y=(cy-rect.top)*(colorImageCanvas.height/rect.height);
  x=Math.max(0,Math.min(colorImageCanvas.width-1,Math.floor(x)));
  y=Math.max(0,Math.min(colorImageCanvas.height-1,Math.floor(y)));
  const px=colorImageCtx.getImageData(x,y,1,1).data;
  const hex=rgbToHex(px[0],px[1],px[2]);
  applyPickedColor(hex);
  colorSample.style.display='block';
  colorSample.style.left=(cx-rect.left)+'px';
  colorSample.style.top=(cy-rect.top)+'px';
  colorSample.style.background=hex
}

function spacedTextWidth(ctx,text,spacingPx=0){
  const chars=[...String(text||'')];
  if(!chars.length)return 0;
  return ctx.measureText(chars.join('')).width + spacingPx*Math.max(0,chars.length-1);
}

function wrapLines(ctx,text,maxW,spacingPx=0){
  const out=[];
  for(const para of String(text).split('\n')){
    if(para===''){out.push('');continue}
    let line='';
    for(const ch of para){
      const test=line+ch;
      if(spacedTextWidth(ctx,test,spacingPx)>maxW&&line){
        out.push(line);
        line=ch;
      }else{
        line=test;
      }
    }
    if(line)out.push(line)
  }
  return out
}

function drawSpacedText(ctx,text,x,y,spacingPx=0){
  const chars=[...String(text||'')];
  if(!chars.length)return;
  if(Math.abs(spacingPx)<0.001){
    ctx.fillText(chars.join(''),x,y);
    return;
  }
  let cx=x;
  chars.forEach((ch,i)=>{
    ctx.fillText(ch,cx,y);
    cx+=ctx.measureText(ch).width;
    if(i<chars.length-1)cx+=spacingPx;
  });
}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}

function drawPageBackground(ctx,W,H){
  const bg=state.pageBackground;
  ctx.save();
  ctx.globalAlpha=Math.max(0,Math.min(1,Number(bg.opacity ?? 1)));

  if(bg.type==='image'&&pageBackgroundExportImage){
    ctx.fillStyle=bg.color1||'#f4f4f2';
    ctx.fillRect(0,0,W,H);
    const img=pageBackgroundExportImage;
    const scale=Math.max(W/img.naturalWidth,H/img.naturalHeight);
    const dw=img.naturalWidth*scale,dh=img.naturalHeight*scale;
    ctx.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);
    ctx.restore();
    return;
  }
  if(bg.type==='gradient'){
    const points={
      right:[0,0,W,0],
      downRight:[0,0,W,H],
      down:[0,0,0,H],
      downLeft:[W,0,0,H]
    };
    const p=points[bg.direction]||points.down;
    const g=ctx.createLinearGradient(...p);
    g.addColorStop(0,bg.color1);
    g.addColorStop(1,bg.color2);
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
    return;
  }
  ctx.fillStyle=bg.color1||'#f4f4f2';
  ctx.fillRect(0,0,W,H);
  ctx.restore();
}


function drawBubbleShape(ctx,{x,y,w,h,r=18,style='rounded',color='#fff',align='left'}){
  ctx.save();
  if(style==='outline'){
    roundRect(ctx,x,y,w,h,Math.max(6,Math.round(r*.45)));
    ctx.fillStyle='rgba(255,255,255,.72)';
    ctx.fill();
    ctx.lineWidth=1;
    ctx.strokeStyle=color;
    ctx.stroke();
    ctx.restore();
    return;
  }

  const radius=style==='square'?Math.max(5,Math.round(r*.32)):r;

  if(style==='tail'){
    roundRect(ctx,x,y,w,h,radius);
    ctx.fillStyle=color;
    ctx.fill();
    ctx.beginPath();
    if(align==='right'){
      ctx.moveTo(x+w-radius*1.2,y);
      ctx.lineTo(x+w-radius*.25,y);
      ctx.lineTo(x+w-radius*.55,y-radius*.7);
    }else{
      ctx.moveTo(x+radius*.25,y);
      ctx.lineTo(x+radius*1.2,y);
      ctx.lineTo(x+radius*.55,y-radius*.7);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    return;
  }

  roundRect(ctx,x,y,w,h,radius);
  ctx.fillStyle=color;
  ctx.fill();
  ctx.restore();
}

    nameOpacity:name?Number(getComputedStyle(name).opacity||1):1,
    bubbleColor:body?getComputedStyle(body).backgroundColor:null,
    bubbleBorderColor:body?getComputedStyle(body).borderColor:null,
    highlightColor:highlight?getComputedStyle(highlight).backgroundColor:null
  };
}

function drawExport(pageNumber=0){
  const W=1080;
  const H=state.exportRatio==='1:1'?1080:state.exportRatio==='2:3'?1620:1440;
  const previewPage=canvas.querySelector('.preview-page');
  const previewWidth=Math.max(1,previewPage?.getBoundingClientRect().width||previewPage?.clientWidth||720);
  const exportScale=W/previewWidth;
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const ctx=c.getContext('2d');
  drawPageBackground(ctx,W,H);

  const margins=currentMarginKeys();
  const padLeft=W*(state[margins.left]/100);
  const padRight=W*(state[margins.right]/100);
  const padTop=W*(state[margins.top]/100);
  const padBottom=W*(state[margins.bottom]/100);
  const maxW=W-padLeft-padRight;
  ctx.textBaseline='top';

  const arr=currentList().filter(p=>(Number.isInteger(p.previewPage)?p.previewPage:0)===pageNumber);
  const blocks=[];let total=0;
  arr.forEach(p=>{
    const st=currentComputedStyle(p);
    const font=state[currentFontSizeKey()] * fontScale(st.font) * exportScale;
    const family=fontCss(st.font);
    const shown=currentDisplayText(p);
    const preset=getCurrentRolePreset(p.role)||{};
    const previewVisual=previewVisualForParagraph(p);
    const weight=st.bold?800:500;
    const italic=st.italic?'italic ':'';
    ctx.font=`${italic}${weight} ${font}px ${family}`;

    const profile=currentPresetProfileImage(p.role);
    const profileScale=Number(preset.profileScale)||1.55;
    const avatarSize=profile?Math.round(font*profileScale):0;
    const avatarGap=profile?8*exportScale:0;
    const textMaxW=maxW-avatarSize-avatarGap;
    const letterPx=font*state.novelLetterSpacing;
    const lines=wrapLines(ctx,shown,textMaxW,letterPx);
    const lh=Math.round(font*state.novelLineHeight);
    const name=String(preset.name||'').trim();
    const nameScale=Number(preset.nameScale)||0.62;
    const nameFont=name?font*nameScale:0;
    const nameGap=name?nameFont*.28:0;
    const bubble=!!preset.bubble;
    const bubblePadX=bubble?Math.round(font*.72):0;
    const bubblePadY=bubble?Math.round(font*.55):0;
    const textHeight=Math.max(lh,lines.length*lh);
    const nameBlockHeight=name?nameFont*1.2+nameGap:0;
    const contentHeight=nameBlockHeight+textHeight+(bubble?bubblePadY*2:0);
    const h=Math.max(contentHeight,profile?avatarSize:0);
    blocks.push({
      p,
      st:{...st,color:cssColorForExport(previewVisual?.textColor,st.color)},
      font,family,weight,italic,lines,lh,h,letterPx,profile,avatarSize,avatarGap,
      name,
      nameColor:cssColorForExport(previewVisual?.nameColor,preset.nameColor||'#777777'),
      nameOpacity:Number.isFinite(previewVisual?.nameOpacity)?previewVisual.nameOpacity:.68,
      nameFont,nameGap,bubble,
      bubbleColor:cssColorForExport(
        (preset.bubbleStyle||'rounded')==='outline'
          ? previewVisual?.bubbleBorderColor
          : previewVisual?.bubbleColor,
        preset.bubbleColor||'#ffffff'
      ),
      bubbleStyle:(preset.bubbleStyle||'rounded'),
      bubblePadX,bubblePadY,textMaxW,
      highlightColor:cssColorForExport(previewVisual?.highlightColor,'')
    });
    total+=h+26*exportScale;
  });
  if(blocks.length)total-=26*exportScale;

  const creditValue=state.previewCreditPage===pageNumber?resolvedCreditText():'';
  const creditFont=14*exportScale;
  const creditGap=creditValue?(blocks.length?26*exportScale:0):0;
  const creditHeight=creditValue?creditFont:0;
  if(creditValue)total+=creditGap+creditHeight;

  let y;
  if(state.verticalAlign==='middle')y=Math.max(padTop,padTop+(H-padTop-padBottom-total)/2);
  else if(state.verticalAlign==='bottom')y=Math.max(padTop,H-padBottom-total);
  else y=padTop;

  for(const b of blocks){
    ctx.font=`${b.italic}${b.weight} ${b.font}px ${b.family}`;
    ctx.fillStyle=b.st.color;ctx.textAlign='left';
    if(b.p.effect==='quote')ctx.fillRect(padLeft-18*exportScale,y,3*exportScale,b.h);

    let avatarOffset=0;
    const avatarOnRight=!!(b.profile && b.st.align==='right');
    if(b.profile){
      const img=exportImageCache.get(b.profile);
      if(img){
        const s=b.avatarSize;
        const ax=avatarOnRight ? W-padRight-s : padLeft;
        const ay=y+Math.round(b.font*.08);
        ctx.save();
        ctx.beginPath();
        ctx.arc(ax+s/2,ay+s/2,s/2,0,Math.PI*2);
        ctx.clip();
        ctx.drawImage(img,ax,ay,s,s);
        ctx.restore();
        avatarOffset=s+b.avatarGap;
      }
    }

    let textTop=y;
    const areaLeft=avatarOnRight ? padLeft : padLeft+avatarOffset;
    const areaRight=avatarOnRight ? W-padRight-avatarOffset : W-padRight;
    const areaW=areaRight-areaLeft;

    if(b.name){
      ctx.font=`700 ${b.nameFont}px ${b.family}`;
      ctx.fillStyle=b.nameColor;
      ctx.globalAlpha=b.nameOpacity;
      let nx=areaLeft;
      const nameLetterPx=b.nameFont*state.novelLetterSpacing;
      const nw=spacedTextWidth(ctx,b.name,nameLetterPx);
      if(b.st.align==='center')nx=areaLeft+(areaW-nw)/2;
      if(b.st.align==='right')nx=areaRight-nw;
      drawSpacedText(ctx,b.name,nx,textTop,nameLetterPx);
      ctx.globalAlpha=1;
      textTop+=b.nameFont*1.2+b.nameGap;
      ctx.font=`${b.italic}${b.weight} ${b.font}px ${b.family}`;
    }

    if(b.bubble){
      const widths=b.lines.map(ln=>spacedTextWidth(ctx,ln,b.letterPx));
      const bubbleW=Math.min(areaW,Math.max(...widths,0)+b.bubblePadX*2);
      const bubbleH=Math.max(b.lh,b.lines.length*b.lh)+b.bubblePadY*2;
      let bx=areaLeft;
      if(b.st.align==='center')bx=areaLeft+(areaW-bubbleW)/2;
      if(b.st.align==='right')bx=areaRight-bubbleW;
      drawBubbleShape(ctx,{
        x:bx,
        y:textTop,
        w:bubbleW,
        h:bubbleH,
        r:Math.round(b.font*.9),
        style:b.bubbleStyle,
        color:b.bubbleColor,
        align:b.st.align
      });
      textTop+=b.bubblePadY;
    }

    b.lines.forEach((ln,i)=>{
      const tw=spacedTextWidth(ctx,ln,b.letterPx);
      let x=areaLeft+(b.bubble?b.bubblePadX:0);
      if(b.st.align==='center'){
        x=areaLeft+(areaW-tw)/2;
      }
      if(b.st.align==='right')x=areaRight-tw-(b.bubble?b.bubblePadX:0);
      if(b.p.effect==='highlight'&&ln){
        const lineW=spacedTextWidth(ctx,ln,b.letterPx);
        if(b.highlightColor){
          ctx.fillStyle=b.highlightColor;
        }else{
          const hc=state.highlightColor||'#f3dfc5';
          const hr=parseInt(hc.slice(1,3),16),hg=parseInt(hc.slice(3,5),16),hb=parseInt(hc.slice(5,7),16);
          ctx.fillStyle=`rgba(${hr},${hg},${hb},${state.highlightOpacity})`;
        }
        ctx.fillRect(x-3*exportScale,textTop+i*b.lh-2*exportScale,lineW+6*exportScale,b.font+10*exportScale);
        ctx.fillStyle=b.st.color;
      }
      drawSpacedText(ctx,ln,x,textTop+i*b.lh,b.letterPx);
    });
    y+=b.h+26*exportScale;
  }

  if(creditValue){
    y+=creditGap;
    ctx.font=`400 ${creditFont}px -apple-system,BlinkMacSystemFont,sans-serif`;
    ctx.fillStyle='#9a9aa0';
    ctx.textAlign='right';
    ctx.textBaseline='top';
    ctx.fillText(creditValue,W-padRight,y);
  }
  return c;
}


function previewExportGeometryAudit(){
  const page=canvas.querySelector('.preview-page');
  if(!page)return null;
  const rect=page.getBoundingClientRect();
  const cs=getComputedStyle(page);
  const margins=currentMarginKeys();
  const expected={
    left:rect.width*(state[margins.left]/100),
    right:rect.width*(state[margins.right]/100),
    top:rect.width*(state[margins.top]/100),
    bottom:rect.width*(state[margins.bottom]/100)
  };
  const actual={
    left:parseFloat(cs.paddingLeft)||0,
    right:parseFloat(cs.paddingRight)||0,
    top:parseFloat(cs.paddingTop)||0,
    bottom:parseFloat(cs.paddingBottom)||0
  };
  return {pageWidth:rect.width,expected,actual,delta:{
    left:actual.left-expected.left,
    right:actual.right-expected.right,
    top:actual.top-expected.top,
    bottom:actual.bottom-expected.bottom
  }};
}

async function makeFiles(){
  // Canvas는 웹폰트 로딩 전에 그리면 빈 글자/대체 폰트가 될 수 있으므로
  // 현재 사용 중인 역할 폰트를 먼저 확실히 준비한다.
  if(document.fonts){
    try{
      if(true){
        const usedKeys=[...new Set(currentList().map(p=>(getCurrentRolePreset(p.role)?.font)||'sans'))];

        await Promise.all(
          usedKeys
            .filter(key=>key!=='sans')
            .map(key=>{
              const family=fontCss(key);
              return Promise.all([
                document.fonts.load(`400 ${Math.round(state[currentFontSizeKey()] * fontScale(key))}px ${family}`),
                document.fonts.load(`700 ${Math.round(state[currentFontSizeKey()] * fontScale(key))}px ${family}`)
              ]);
            })
        );
      }

      await document.fonts.ready;
    }catch(e){
      console.warn('Font preload skipped',e);
    }
  }

  if(true){
    try{await preloadPresetImages();}catch(e){console.warn('Profile image preload skipped',e);}
  }
  try{await preloadPageBackground();}catch(e){console.warn('Background image preload skipped',e);}

  render();
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));

  const files=[];
  const count=Math.max(1,state.previewPageCount||1);
  for(let i=0;i<count;i++){
    const c=drawExport(i);
    const blob=await new Promise((res,rej)=>
      c.toBlob(b=>b?res(b):rej(new Error('PNG blob creation failed')),'image/png',1)
    );
    const suffix=count>1?`-${i+1}`:'';
    files.push(new File([blob],`excerpt${suffix}.png`,{type:'image/png'}));
  }
  return files;
}

document.getElementById('saveBtn').onclick=async()=>{
  try{
    const files=await makeFiles();
    files.forEach((f,i)=>{
      setTimeout(()=>{
        const u=URL.createObjectURL(f);
        const a=document.createElement('a');
        a.href=u;
        a.download=f.name;
        a.click();
        setTimeout(()=>URL.revokeObjectURL(u),2000);
      },i*180);
    });
    showToast(files.length>1?`${files.length}장 다운로드를 실행했어요`:'다운로드를 실행했어요');
  }catch{showToast('PNG 생성 실패')}
};
document.getElementById('shareBtn').onclick=async()=>{
  try{
    const files=await makeFiles();
    if(navigator.share&&navigator.canShare&&navigator.canShare({files})){
      await navigator.share({files,title:'발췌'});
    }else showToast('이 브라우저는 파일 공유를 지원하지 않아요');
  }catch(e){if(e.name!=='AbortError')showToast('공유 실패')}
};

async function bootApp(){
  await hydratePrimaryState();
  syncFontTopUI();
  syncRatioUI();
  syncAlignUI();
  render();
}
bootApp();
